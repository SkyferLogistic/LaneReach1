[project]
name = "lanereach"
version = "0.1.0"
description = "LaneReach AI + Automation backend: turns a forwarder's contact database into quote-ready leads."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.9",
    "cryptography>=44",
    "httpx>=0.27",
    "email-validator>=2.2",
    "holidays>=0.60",
    "anthropic>=1.0",
    "openai>=1.50",
    "mammoth>=1.8",
    "python-docx>=1.1",
    "nh3>=0.2.18",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis]>=4.8",
    "time-machine>=2.15",
    "pip-audit>=2.7",
    "celery-types>=0.22",
]

[project.scripts]
lanereach-admin = "lanereach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanereach"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "T20", "UP", "S", "ASYNC", "SIM", "RUF", "N", "PT", "D"]
ignore = [
    "D105",   # magic methods need no docstring
    "D107",   # __init__ documented on the class
    "RUF012", # ClassVar annotations are explicit where it matters
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "N802", "RUF001", "E501"]
"alembic/**" = ["D"]
"evals/**" = ["S101", "T201"]
# Keyword tables and multilingual patterns: long data lines and typographic characters on purpose.
"src/lanereach/ai/llm/providers/heuristics.py" = ["E501", "RUF001"]
"src/lanereach/ai/rules/reply_rules.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["lanereach"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "kombu.*", "asyncpg.*", "mammoth.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (testcontainers Postgres/Redis)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/lanereach"]
concurrency = ["greenlet", "thread"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
