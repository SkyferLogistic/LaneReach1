# One origin for the browser: the console, and the API behind /api (no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The build ships a .gz next to every script and stylesheet (Dockerfile): serve those, and
    # compress anything else text-like on the fly. Uncompressed, the first visit downloads ~1 MB.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(api|docs|openapi\.json) {
        # Look the API up through Docker's DNS on every request (cached 10 s): a rebuilt or
        # restarted API container gets a new address, and a fixed upstream would answer 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Word/PDF scripts may be up to MAX_UPLOAD_BYTES (10 MB) plus the multipart envelope.
        client_max_body_size 11m;
    }

    # Hashed build assets can be cached forever; index.html never.
    # nginx drops server-level add_header lines in a location that sets its own: repeat them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
